name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lần đẩy mới trên cùng nhánh hủy lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saha
          POSTGRES_PASSWORD: saha_ci
          POSTGRES_DB: saha_econtract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://saha:saha_ci@localhost:5432/saha_econtract?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Cùng phiên bản với image production (infra/docker/*.Dockerfile: node:24-alpine).
          node-version: 24
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        # Lỗi cài đặt hiện cả ở mục Annotations (xem được không cần mở log).
        run: |
          set -o pipefail
          if ! pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log; then
            echo "::error title=pnpm install::$(tail -n 40 /tmp/install.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - run: pnpm --filter @saha/shared build
      - run: pnpm --filter @saha/api prisma:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee /tmp/build.log; then
            echo "::error title=pnpm build::$(tail -n 40 /tmp/build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: API_URL=http://api:4000
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate production compose
        run: |
          cp .env.production.example .env.ci
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^JWT_ACCESS_SECRET=$/JWT_ACCESS_SECRET=ci/; s/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=ci/; s/^S3_SECRET_ACCESS_KEY=$/S3_SECRET_ACCESS_KEY=ci/; s/^SMTP_HOST=$/SMTP_HOST=smtp.ci/' .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet
